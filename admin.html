<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA Management — Admin</title>
  <style>
    :root {
      --bg: #0b1110;
      --panel: #111a18;
      --panel-2: #17211f;
      --line: #263632;
      --text: #f4f7f6;
      --muted: #9eafaa;
      --accent: #9ccf5a;
      --accent-2: #c8e89a;
      --danger: #ff7777;
      --warning: #ffd166;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, rgba(156, 207, 90, 0.1), transparent 35%),
        radial-gradient(circle at bottom right, rgba(84, 145, 112, 0.1), transparent 35%),
        var(--bg);
      color: var(--text);
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* Login */
    #login-view {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: min(430px, 100%);
      padding: 32px;
      background: rgba(17, 26, 24, 0.92);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), #557f45);
      color: #10170f;
      font-weight: 900;
      font-size: 22px;
    }

    h1, h2, h3, p {
      margin-top: 0;
    }

    .login-card h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.6;
    }

    .field {
      margin: 16px 0;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .field input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0c1312;
      color: var(--text);
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent);
    }

    .primary-btn, .google-btn, .logout-btn, .tab-btn, .action-btn, .refresh {
      border: 0;
      border-radius: 12px;
      padding: 12px 15px;
      transition: 0.2s ease;
      font-weight: 600;
    }

    .primary-btn {
      width: 100%;
      background: var(--accent);
      color: #0b1109;
      font-weight: 800;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
    }

    .google-btn {
      width: 100%;
      margin-top: 10px;
      background: #f4f7f6;
      color: #111;
      font-weight: 700;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      margin: 18px 0;
    }

    .divider:before, .divider:after {
      content: "";
      height: 1px;
      background: var(--line);
      flex: 1;
    }

    .login-error {
      color: var(--danger);
      min-height: 20px;
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    /* App */
    #admin-view {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 22px;
      background: rgba(11, 17, 16, 0.88);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 18px;
    }

    .admin-title {
      font-weight: 800;
    }

    .admin-email {
      font-size: 12px;
      color: var(--muted);
    }

    .logout-btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .logout-btn:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .container {
      width: min(1400px, calc(100% - 32px));
      margin: 24px auto 50px;
    }

    .welcome {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 22px;
    }

    .welcome p {
      color: var(--muted);
      margin: 4px 0 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
    }

    .stat-label {
      font-size: 13px;
      color: var(--muted);
    }

    .stat-value {
      font-size: 30px;
      font-weight: 850;
      margin-top: 7px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0b1109;
      font-weight: 800;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .search {
      flex: 1;
      min-width: 230px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      outline: none;
    }

    .refresh {
      padding: 12px 15px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
    }

    .refresh:hover {
      border-color: var(--accent);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
    }

    .table-wrap {
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.015);
      white-space: nowrap;
    }

    td {
      font-size: 14px;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .muted {
      color: var(--muted);
    }

    .status {
      display: inline-flex;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(156, 207, 90, 0.12);
      color: var(--accent-2);
      font-size: 12px;
      font-weight: 750;
    }

    .status.off {
      background: rgba(255, 119, 119, 0.1);
      color: #ff9a9a;
    }

    .status.pending {
      background: rgba(255, 209, 102, 0.1);
      color: var(--warning);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .chip {
      padding: 5px 8px;
      border-radius: 8px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: #d8e3df;
      font-size: 12px;
    }

    .empty, .loading, .error {
      padding: 35px 20px;
      text-align: center;
      color: var(--muted);
    }

    .error {
      color: var(--danger);
    }

    .product-thumb {
      width: 58px;
      height: 58px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--panel-2);
      border: 1px solid var(--line);
    }

    .small {
      font-size: 12px;
    }

    .notice {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(156, 207, 90, 0.08);
      border: 1px solid rgba(156, 207, 90, 0.2);
      color: #d9e9d0;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 12px 14px;
      }

      .container {
        width: min(100% - 20px, 1400px);
        margin-top: 18px;
      }

      .topbar .admin-email {
        display: none;
      }

      .welcome {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      .stat {
        padding: 15px;
      }

      .stat-value {
        font-size: 24px;
      }

      .login-card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <!-- LOGIN VIEW -->
  <section id="login-view">
    <div class="login-card">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div>
          <strong>AURA</strong>
          <div class="muted small">Management Admin</div>
        </div>
      </div>

      <h1>Admin Login</h1>
      <p class="subtitle">Sign in to view food-waste requests.</p>

      <form id="login-form">
        <div class="field">
          <label for="login-email">Admin Email</label>
          <input id="login-email" type="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </div>

        <button class="primary-btn" type="submit">Login</button>
      </form>

      <div class="divider">OR</div>

      <button class="google-btn" id="google-login" type="button">Continue with Google</button>

      <div id="login-error" class="login-error"></div>
    </div>
  </section>

  <!-- ADMIN VIEW -->
  <section id="admin-view" class="hidden">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand-mark">A</div>
        <div>
          <div class="admin-title">AURA Management</div>
          <div class="admin-email" id="admin-email"></div>
        </div>
      </div>
      <button id="logout-btn" class="logout-btn" type="button">Logout</button>
    </header>

    <main class="container">
      <div class="welcome">
        <div>
          <h1>Admin Dashboard</h1>
          <p>Monitor food-waste requests.</p>
        </div>
      </div>

      <div id="admin-notice" class="notice hidden"></div>

      <section class="stats">
        <div class="stat">
          <div class="stat-label">Requests</div>
          <div class="stat-value" id="stat-requests">—</div>
        </div>
      </section>

      <!-- REQUESTS TAB -->
      <section id="tab-requests" class="tab-panel">
        <div class="toolbar">
          <input class="search" id="request-search" placeholder="Search request ID, email, phone, category..." />
          <button class="refresh" data-refresh="requests">Refresh</button>
        </div>
        <div class="panel">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Request</th>
                  <th>User Contact</th>
                  <th>Category</th>
                  <th>Waste Types</th>
                  <th>Address</th>
                  <th>Location</th>
                  <th>Status</th>
                  <th>Created</th>
                </tr>
              </thead>
              <tbody id="requests-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </section>

  <script type="module">
    import {
      getAuth,
      signInWithEmailAndPassword,
      signInWithPopup,
      GoogleAuthProvider,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";

    // ========== FIREBASE INIT ==========
    const firebaseConfig = {
      apiKey: "AIzaSyBOU5TRy80JkKhWEwbNIe9Ei5-e_QztN3k",
      authDomain: "zearn-app.firebaseapp.com",
      projectId: "zearn-app",
      storageBucket: "zearn-app.firebasestorage.app",
      messagingSenderId: "212045636123",
      appId: "1:212045636123:web:495ba5939bdc5c89050ebe",
      measurementId: "G-GMLDVHFFLN"
    };

    let app, auth, db, googleProvider;

    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      googleProvider = new GoogleAuthProvider();
      console.log("✅ Firebase initialized successfully");
    } catch (error) {
      console.error("❌ Firebase init error:", error);
      document.getElementById("login-error").textContent = "Firebase initialization failed. Check console.";
    }

    // ========== ADMIN EMAIL CHECK ==========
    const ADMIN_EMAILS = ["hari066@gmail.com"];

    function isAdmin(user) {
      if (!user || !user.email) return false;
      const email = user.email.toLowerCase().trim();
      return ADMIN_EMAILS.map(e => e.toLowerCase().trim()).includes(email);
    }

    // ========== UI ELEMENTS ==========
    const loginView = document.getElementById("login-view");
    const adminView = document.getElementById("admin-view");
    const loginForm = document.getElementById("login-form");
    const googleLogin = document.getElementById("google-login");
    const loginError = document.getElementById("login-error");
    const adminEmail = document.getElementById("admin-email");
    const logoutBtn = document.getElementById("logout-btn");

    // ========== AUTH HANDLERS ==========
    function showLoginError(message) {
      loginError.textContent = message || "";
    }

    async function rejectNonAdmin(user) {
      const email = user?.email || "Unknown";
      showLoginError(`Account "${email}" is not authorized for AURA admin.`);
      console.log("❌ Unauthorized:", email);
      try {
        await signOut(auth);
      } catch (e) {
        console.error(e);
      }
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      showLoginError("");

      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      try {
        const result = await signInWithEmailAndPassword(auth, email, password);
        if (!isAdmin(result.user)) {
          await rejectNonAdmin(result.user);
        }
      } catch (error) {
        const messages = {
          "auth/invalid-credential": "Invalid email or password.",
          "auth/invalid-email": "Please enter a valid email address.",
          "auth/user-not-found": "No account exists with this email.",
          "auth/too-many-requests": "Too many attempts. Please try again later."
        };
        showLoginError(messages[error.code] || "Login failed. Please try again.");
      }
    });

    googleLogin.addEventListener("click", async () => {
      showLoginError("");
      try {
        const result = await signInWithPopup(auth, googleProvider);
        if (!isAdmin(result.user)) {
          await rejectNonAdmin(result.user);
        }
      } catch (error) {
        showLoginError(
          error.code === "auth/popup-closed-by-user"
            ? "Google login was cancelled."
            : "Google login failed. Please try again."
        );
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        loginView.classList.remove("hidden");
        adminView.classList.add("hidden");
        return;
      }

      if (!isAdmin(user)) {
        await rejectNonAdmin(user);
        return;
      }

      loginView.classList.add("hidden");
      adminView.classList.remove("hidden");
      adminEmail.textContent = user.email || "";
      await loadDashboard();
    });

    // ========== HELPERS ==========
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      if (!value) return "—";
      try {
        const date = typeof value?.toDate === "function" ? value.toDate() : new Date(value);
        if (Number.isNaN(date.getTime())) return "—";
        return date.toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });
      } catch {
        return "—";
      }
    }

    function normalize(value) {
      return String(value ?? "").toLowerCase();
    }

    function renderEmpty(tbody, colspan) {
      tbody.innerHTML = `<tr><td colspan="${colspan}"><div class="empty">No records found.</div></td></tr>`;
    }

    function renderLoading(tbody, colspan) {
      tbody.innerHTML = `<tr><td colspan="${colspan}"><div class="loading">Loading…</div></td></tr>`;
    }

    function renderError(tbody, colspan, message) {
      tbody.innerHTML = `<tr><td colspan="${colspan}"><div class="error">${escapeHtml(message)}</div></td></tr>`;
    }

    // ========== DATA STORES ==========
    let requestRows = [];

    // ========== LOAD DATA ==========
    async function loadRequests() {
      const tbody = document.getElementById("requests-body");
      renderLoading(tbody, 8);

      try {
        const q = query(collection(db, "foodWasteRequests"), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);

        requestRows = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));

        renderRequests();
        document.getElementById("stat-requests").textContent = requestRows.length;
      } catch (error) {
        console.error(error);
        renderError(tbody, 8, "Unable to load requests.");
      }
    }

    async function loadDashboard() {
      await loadRequests();
    }
// ========== RENDER REQUESTS ==========
    function renderRequests() {
      const tbody = document.getElementById("requests-body");
      const search = normalize(document.getElementById("request-search").value);

      const filtered = requestRows.filter(item => {
        const waste = Array.isArray(item.selectedWasteTypes)
          ? item.selectedWasteTypes.join(" ")
          : "";
        const text = [
          item.requestId,
          item.email,
          item.phone,
          item.category,
          item.address,
          item.status,
          waste
        ].join(" ");
        return normalize(text).includes(search);
      });

      if (!filtered.length) {
        renderEmpty(tbody, 8);
        return;
      }

      tbody.innerHTML = filtered
        .map(item => {
          const wasteTypes = Array.isArray(item.selectedWasteTypes) ? item.selectedWasteTypes : [];
          const locationText = item.locationShared
            ? `${Number(item.latitude || 0).toFixed(5)}, ${Number(item.longitude || 0).toFixed(5)}`
            : "Not shared";

          return `
            <tr>
              <td>
                <strong>${escapeHtml(item.requestId || item.id)}</strong>
                <div class="muted small">${escapeHtml(item.id)}</div>
              </td>
              <td>
                <strong>${escapeHtml(item.email || "—")}</strong>
                <div class="muted small">${escapeHtml(item.phone || "—")}</div>
              </td>
              <td>${escapeHtml(item.category || "—")}</td>
              <td>
                <div class="chips">
                  ${wasteTypes.length
                    ? wasteTypes.map(w => `<span class="chip">${escapeHtml(w)}</span>`).join("")
                    : "—"}
                </div>
              </td>
              <td>${escapeHtml(item.address || "—")}</td>
              <td>${escapeHtml(locationText)}</td>
              <td>
                <span class="status ${item.status === "NEW" ? "pending" : ""}">
                  ${escapeHtml(item.status || "—")}
                </span>
              </td>
              <td>${escapeHtml(formatDate(item.createdAt))}</td>
            </tr>
          `;
        })
        .join("");
    }

    // ========== SEARCH ==========
    document.getElementById("request-search").addEventListener("input", renderRequests);

    // ========== REFRESH ==========
    document.querySelectorAll("[data-refresh]").forEach(button => {
      button.addEventListener("click", async () => {
        button.disabled = true;
        try {
          if (button.dataset.refresh === "requests") await loadRequests();
        } finally {
          button.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
